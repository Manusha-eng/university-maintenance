
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Maintenance Complaints</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Maintenance Complaints</h1>

    <p>
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/complaints/new}">Add New Complaint</a>
    </p>

    <h3>Search and Filter</h3>

    <form th:action="@{/complaints}" method="get">

        <label for="keyword">Search Complaints</label>
        <input type="text"
               id="keyword"
               name="keyword"
               placeholder="Title, description or location"
               th:value="${keyword}">

        <label for="status">Filter by Status</label>
        <select id="status" name="status">
            <option value="" th:selected="${selectedStatus == ''}">
                All Statuses
            </option>
            <option value="PENDING"
                    th:selected="${selectedStatus == 'PENDING'}">
                Pending
            </option>
            <option value="IN_PROGRESS"
                    th:selected="${selectedStatus == 'IN_PROGRESS'}">
                In Progress
            </option>
            <option value="COMPLETED"
                    th:selected="${selectedStatus == 'COMPLETED'}">
                Completed
            </option>
        </select>

        <label for="sortBy">Sort By</label>
        <select id="sortBy" name="sortBy">
            <option value="newest"
                    th:selected="${sortBy == 'newest'}">
                Newest First
            </option>
            <option value="oldest"
                    th:selected="${sortBy == 'oldest'}">
                Oldest First
            </option>
            <option value="title_az"
                    th:selected="${sortBy == 'title_az'}">
                Title A to Z
            </option>
            <option value="title_za"
                    th:selected="${sortBy == 'title_za'}">
                Title Z to A
            </option>
        </select>

        <button type="submit">Apply</button>
        <a th:href="@{/complaints}">Clear Filters</a>

    </form>

    <h3>Complaint List</h3>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.id}"></td>
                    <td th:text="${complaint.title}"></td>
                    <td th:text="${complaint.location}"></td>
                    <td th:text="${complaint.category}"></td>
                    <td th:text="${complaint.priority}"></td>
                    <td th:text="${complaint.status}"></td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/complaints/{id}(id=${complaint.id})}">
                                View
                            </a>

                            <a th:href="@{/complaints/edit/{id}(id=${complaint.id})}">
                                Edit
                            </a>

                            <form th:action="@{/complaints/delete/{id}(id=${complaint.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this complaint?');">
                                <button type="submit">Delete</button>
                            </form>

                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p th:if="${#lists.isEmpty(complaints)}">
        No matching complaints found.
    </p>

</div>

</body>
</html>
