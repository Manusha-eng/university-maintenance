
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Complaint Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1 th:text="${complaint.id == null} ? 'Submit a Complaint' : 'Edit Complaint'">
        Complaint Form
    </h1>

    <form th:object="${complaint}"
          th:action="${complaint.id == null} ? @{/complaints/save} : @{/complaints/update/{id}(id=${complaint.id})}"
          method="post">

        <label for="title">Complaint Title</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               maxlength="150"
               required>

        <p class="error"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}"></p>

        <label for="description">Description</label>
        <textarea id="description"
                  th:field="*{description}"
                  rows="5"
                  maxlength="2000"
                  required></textarea>

        <p class="error"
           th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}"></p>

        <label for="location">Location</label>
        <input type="text"
               id="location"
               th:field="*{location}"
               maxlength="150"
               required>

        <p class="error"
           th:if="${#fields.hasErrors('location')}"
           th:errors="*{location}"></p>

<label for="buildingId">Building</label>

<select id="buildingId" name="buildingId">

    <option value="">-- Select Building --</option>

    <option th:each="building : ${buildings}"
            th:value="${building.id}"
            th:text="${building.name}"
            th:selected="${selectedBuildingId != null and selectedBuildingId == building.id}">
    </option>

</select>

<p class="error"
   th:each="error : ${#fields.globalErrors()}"
   th:text="${error}">
</p>

        <label for="category">Category</label>
        <select id="category" th:field="*{category}">
            <option value="OTHER">Other</option>
            <option value="ELECTRICAL">Electrical</option>
            <option value="PLUMBING">Plumbing</option>
            <option value="FURNITURE">Furniture</option>
            <option value="NETWORK">Network</option>
            <option value="AIR_CONDITIONING">Air Conditioning</option>
        </select>

        <label for="priority">Priority</label>
        <select id="priority" th:field="*{priority}">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
        </select>

        <div th:if="${complaint.id != null}">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
            </select>
        </div>

        <button type="submit">Save Complaint</button>
    </form>

    <p>
        <a th:href="@{/}">Back to Home</a>
    </p>

</div>

</body>
</html>
